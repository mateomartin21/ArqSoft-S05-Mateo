name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restaurar
        run: dotnet restore CitasApp.Tests/CitasApp.Tests.csproj
      - name: Compilar
        run: dotnet build CitasApp.Tests/CitasApp.Tests.csproj --no-restore
      - name: Correr pruebas
        run: dotnet test CitasApp.Tests/CitasApp.Tests.csproj --no-build